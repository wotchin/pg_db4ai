name: Publish verified lightweight AutoML sources
on:
  push:
    branches: [lightweight-automl]
    paths: [.github/workflows/apply-automl.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete patch before modifying any source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,shutil,subprocess
          from pathlib import Path
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          encoded=''.join(Path(f'.automl-source/part{i}').read_text().strip() for i in range(6))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='eb89415a011a59d9ee4a8a157c1d860dd5d625c72a0b959214be8e1eb8e8577f'
          specs=json.loads(raw)
          assert len(specs)==31
          output={};manifest={}
          for spec in specs:
              path=Path(spec['path']);base=Path(spec['base'])
              assert not path.is_absolute() and '..' not in path.parts and '.github' not in path.parts
              assert not base.is_absolute() and '..' not in base.parts
              if spec['old'] is None:
                  assert not path.exists(),f'new path exists: {path}'
              else:
                  assert blob(path.read_bytes())==spec['old'],f'concurrent source change: {path}'
              if spec['base_sha'] is not None:
                  initial=base.read_bytes()
                  assert blob(initial)==spec['base_sha'],f'base mismatch: {base}'
              else:
                  initial=b''
              lines=initial.decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(spec['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=text.splitlines(keepends=True)
              result=''.join(lines).encode()
              assert blob(result)==spec['new'],f'output mismatch: {path}'
              assert spec['mode'] in (420,493)
              output[str(path)]=(result,spec['mode'])
              manifest[str(path)]={'blob':blob(result),'sha256':hashlib.sha256(result).hexdigest(),'mode':spec['mode']}
          for name,(content,mode) in output.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content);p.chmod(mode)
          shutil.rmtree('.automl-source')
          Path('/tmp/automl-source-integrity.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','add','--',*output.keys()],check=True)
          subprocess.run(['git','add','-u','--','.automl-source'],check=True)
          print('Verified 31 runtime/build/SQL/test/documentation files against exact locally tested blobs.')
          PY
      - name: Commit verified source without overwriting concurrent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement PG-native budget-bounded AutoML with fitted preprocessing and validation-safe selection'
          git push origin HEAD:lightweight-automl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automl-source-integrity
          path: /tmp/automl-source-integrity.json
          retention-days: 30
