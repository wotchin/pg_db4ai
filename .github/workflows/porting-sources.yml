name: DB4AI porting reference sources
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/porting-sources.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package extension and pinned upstream sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar HEAD | gzip > /tmp/pg_db4ai-source.tar.gz
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          repo='opengauss-mirror/openGauss-server'
          ref='8f33f38a306dd4b155b6e77d1bc15554b1afcf8f'
          root=pathlib.Path('/tmp/opengauss-db4ai-reference')
          def get(url):
              r=urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'User-Agent':'DB4AI-porting'})
              return urllib.request.urlopen(r, timeout=120).read()
          tree=json.loads(get(f'https://api.github.com/repos/{repo}/git/trees/{ref}?recursive=1'))
          assert not tree.get('truncated'), 'Incomplete source tree'
          paths=[e['path'] for e in tree['tree'] if e['type']=='blob' and (
              e['path'].startswith('src/include/db4ai/') or
              (e['path'].startswith('src/gausskernel/dbmind/db4ai/') and '/snapshots/' not in e['path']) or
              e['path'] in ['License','src/include/nodes/execnodes.h','src/include/nodes/plannodes.h',
                            'src/gausskernel/runtime/executor/db4ai_common.cpp','src/gausskernel/runtime/executor/nodeTrainModel.cpp'] or
              ('db4ai' in e['path'].lower() and e['path'].startswith('src/test/')))]
          def save(p):
              data=get(f'https://raw.githubusercontent.com/{repo}/{ref}/{p}')
              target=root/p; target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)
              return p, hashlib.sha256(data).hexdigest()
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              files=dict(pool.map(save,paths))
          (root/'REFERENCE.json').write_text(json.dumps({'repository':repo,'commit':ref,'files':files},indent=2))
          print('Saved',len(files),'reference files')
          PY
          tar -C /tmp -czf /tmp/opengauss-db4ai-reference.tar.gz opengauss-db4ai-reference
      - uses: actions/upload-artifact@v4
        with:
          name: db4ai-porting-sources
          path: |
            /tmp/pg_db4ai-source.tar.gz
            /tmp/opengauss-db4ai-reference.tar.gz
          retention-days: 7
