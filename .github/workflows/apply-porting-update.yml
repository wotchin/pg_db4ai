name: Publish verified DB4AI 0.2 sources
on:
  push:
    branches: [db4ai-algorithms-shufflescan]
    paths: [.github/workflows/apply-porting-update.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db4ai-algorithms-shufflescan
          fetch-depth: 0
      - name: Validate source payload and publish without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor b9fed7c515f5d64984ed046c0c6f12dbbff7e689 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root=pathlib.Path.cwd()
          parts=[(root/'.porting-update'/f'part-{i}.b64').read_text().strip() for i in range(7)]
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest() == '6094a58dbb32b69380e270a6dd39bce4e562edb8bc24f3c1c72f2f7f0cce8c97', 'Source transfer checksum mismatch'
          data=lzma.decompress(packed)
          assert hashlib.sha256(data).hexdigest() == 'b13ce7200391c4b292596367d1cdf359d7be28cf726291ad71b620bdafefc880', 'Decoded source checksum mismatch'
          files=json.loads(data)
          allowed=set('CHANGELOG.md Makefile README.md README.zh-CN.md THIRD_PARTY_NOTICES.md pg_db4ai.control'.split())
          inventory={}
          assert len(files)==31
          for name,content in files.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              if name=='.github/workflows/porting-sources.yml':
                  assert content is None
                  continue  # Temporary workflow removal is done separately through the connector.
              assert name in allowed or p.parts[0] in ('src','sql','docs','test')
              assert isinstance(content,str)
              dest=root.joinpath(*p.parts)
              assert not dest.is_symlink()
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(content,encoding='utf-8')
              inventory[name]=hashlib.sha256(dest.read_bytes()).hexdigest()
          (pathlib.Path('/tmp')/'published-source-sha256.json').write_text(json.dumps(inventory,indent=2,sort_keys=True)+'\n')
          shutil.rmtree(root/'.porting-update')
          print('Verified and installed',len(inventory),'source files')
          PY
          git diff --check
          git add CHANGELOG.md Makefile README.md README.zh-CN.md THIRD_PARTY_NOTICES.md pg_db4ai.control src sql docs test .porting-update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement DB4AI 0.2 algorithm coverage and PostgreSQL ShuffleScan' -m 'Add normalized GD, typed One-vs-All classification, random Gaussian/polynomial feature maps, stochastic PCA, KMeans seedings and distances, and internal Bayesian joint estimator. Add bounded batch shuffle runtime and an explicit CustomScan/SRF interface. Preserve durable JSON/UBJSON models, PG-native C11 code, and 0.1 model readers. Local PostgreSQL 18.0 integration, numerical reference, upgrade and restore suites pass with and without vendored XGBoost. Live openGauss end-to-end differential parity is not asserted.'
          git push origin HEAD:refs/heads/db4ai-algorithms-shufflescan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-db4ai-source-integrity
          path: |
            /tmp/published-source-sha256.json
            .porting-update/*.b64
          retention-days: 7
