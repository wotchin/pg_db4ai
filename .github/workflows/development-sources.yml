name: Offline development sources
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/development-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pinned PostgreSQL 18.0 source for compatibility testing
        run: |
          curl --fail --location --retry 3 --output postgresql-18.0.tar.bz2 https://ftp.postgresql.org/pub/source/v18.0/postgresql-18.0.tar.bz2
          echo '0d5b903b1e5fe361bca7aa9507519933773eb34266b1357c4e7780fdee6d6078  postgresql-18.0.tar.bz2' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-offline-source
          path: postgresql-18.0.tar.bz2
          retention-days: 7
