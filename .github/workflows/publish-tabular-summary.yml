name: Persist verified tabular results
on:
  push:
    branches: [benchmark-public-tabular]
    paths: [.github/workflows/publish-tabular-summary.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install previously audited results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,zipfile
          from pathlib import Path
          url='https://api.github.com/repos/wotchin/pg_db4ai/actions/artifacts/12063429680/zip'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json'})
          req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
          with urllib.request.urlopen(req,timeout=90) as response:data=response.read()
          assert hashlib.sha256(data).hexdigest()=='95cd4d89e6edb002c81c064758a78d139ae7a76e88436b83b8e50b617ceb746d'
          out=Path('benchmarks/tabular/results/2026-10-16');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for item in z.infolist():
                  p=Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(out)
          rows=json.loads((out/'raw-results.json').read_text())
          assert len(rows)==744 and all(r['status']=='ok' for r in rows)
          canonical=json.dumps(rows,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          assert hashlib.sha256(canonical).hexdigest()=='6c6487b908abd3364c7114f6bba422a0bcebbc55ba78e20272aaa1b8c8408384'
          audits=json.loads((out/'independent-audits.json').read_text())
          assert sum(a['independently_verified_db_fold_methods'] for a in audits)==156
          assert all(a['ready_with_stated_methodology_caveats'] for a in audits)
          print('Verified exact 744-record evidence with 156 independent metric audits')
          PY
      - name: Commit explicit evidence files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f benchmarks/tabular/results/2026-10-16
          git diff --cached --quiet || git commit -m 'Preserve exact independently verified public tabular benchmark results'
          git push origin HEAD:benchmark-public-tabular
