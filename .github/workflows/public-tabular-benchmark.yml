name: Public tabular Docker benchmark
on:
  workflow_dispatch:
  push:
    branches: [benchmark-public-tabular]
    paths: [.github/workflows/public-tabular-benchmark.yml]
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 2024, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock actual base images
        id: base
        run: |
          mkdir -p /tmp/db4ai-benchmark
          docker pull postgres:18-bookworm
          docker image inspect postgres:18-bookworm > /tmp/db4ai-benchmark/postgres-base.json
          echo "image=$(docker image inspect postgres:18-bookworm --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
          docker pull enmotech/opengauss@sha256:9bd81380273944e5a02a2139c90954d4f46813b71810f7b23fe8f738014d03b5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/tabular/Dockerfile
          load: true
          tags: pg-db4ai-benchmark:local
          build-args: PG_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=db4ai-tabular
      - name: Stage original extension with identical benchmark tooling
        if: matrix.seed == 42
        run: |
          mkdir -p /tmp/db4ai-before
          git archive bde6ee99fc14ad0b2e7cc8e27868470702fe78f8 | tar -x -C /tmp/db4ai-before
          mkdir -p /tmp/db4ai-before/benchmarks
          cp -R benchmarks/tabular /tmp/db4ai-before/benchmarks/
      - uses: docker/build-push-action@v6
        if: matrix.seed == 42
        with:
          context: /tmp/db4ai-before
          file: /tmp/db4ai-before/benchmarks/tabular/Dockerfile
          load: true
          tags: pg-db4ai-before:local
          build-args: PG_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=db4ai-tabular
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/tabular/Dockerfile.opengauss
          load: true
          tags: opengauss-db4ai-benchmark:local
          cache-from: type=gha,scope=db4ai-tabular-og
      - name: Verify complete extension regression suite
        run: |
          mkdir -p /tmp/db4ai-benchmark/regression
          chmod 777 /tmp/db4ai-benchmark/regression
          docker run --rm --user postgres --entrypoint bash \
            -v "$PWD/test:/src/test:ro" -v /tmp/db4ai-benchmark/regression:/test-logs \
            pg-db4ai-benchmark:local -lc \
            'set -o pipefail; cd /src; PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config WITH_XGBOOST=1 sh test/run.sh 2>&1 | tee /test-logs/full.log'
      - name: Host data preparation environment
        run: |
          python3 -m venv /tmp/bench-host
          /tmp/bench-host/bin/pip install numpy==2.3.3 scipy==1.16.2 pandas==2.3.3 scikit-learn==1.7.2 xlrd==2.0.2
      - name: Same-host engine comparison for one fixed split seed
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -o pipefail
          /tmp/bench-host/bin/python benchmarks/tabular/export_transport.py \
            --out /tmp/db4ai-benchmark/results --seeds ${{ matrix.seed }} --repeats 3 \
            2>&1 | tee /tmp/db4ai-benchmark/run.log
      - name: Paired same-host prediction A/B
        if: always() && matrix.seed == 42
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -o pipefail
          if test -f /tmp/db4ai-benchmark/results/results.json; then
            /tmp/bench-host/bin/python benchmarks/tabular/prediction_ab.py \
              --data /tmp/db4ai-benchmark/results --out /tmp/db4ai-benchmark/prediction-ab --repeats 11 \
              2>&1 | tee /tmp/db4ai-benchmark/prediction-ab.log
          fi
      - name: Capture evidence and ensure public benchmark exports are readable
        if: always()
        run: |
          git archive --format=tar.gz HEAD > /tmp/db4ai-benchmark/benchmark-source.tar.gz
          docker image inspect pg-db4ai-benchmark:local > /tmp/db4ai-benchmark/pg-image.json || true
          docker image inspect pg-db4ai-before:local > /tmp/db4ai-benchmark/pg-before-image.json || true
          docker image inspect opengauss-db4ai-benchmark:local > /tmp/db4ai-benchmark/og-image.json || true
          docker stats --no-stream > /tmp/db4ai-benchmark/final-container-stats.txt || true
          # Scope ownership adjustment strictly to generated public-data outputs.
          sudo chown -R "$(id -u):$(id -g)" /tmp/db4ai-benchmark
          find /tmp/db4ai-benchmark -type d -exec chmod u+rwx {} +
          find /tmp/db4ai-benchmark -type f -exec chmod u+r {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-tabular-benchmark-seed-${{ matrix.seed }}
          path: /tmp/db4ai-benchmark
          retention-days: 30
