name: Vendor pinned XGBoost source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - third_party/xgboost.lock.json
      - tools/vendor_xgboost.py
      - .github/workflows/vendor-xgboost.yml
permissions:
  contents: read
concurrency:
  group: vendor-xgboost
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import or repair only missing locked source files
        run: |
          if test -d third_party/xgboost; then
            python3 tools/vendor_xgboost.py --repair-missing
          else
            python3 tools/vendor_xgboost.py
          fi
          python3 tools/vendor_xgboost.py --verify
      - name: Commit all vendored source, including upstream-ignored files
        run: |
          git add -f third_party/xgboost third_party/xgboost.manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Complete SHA256-verified vendored source, including upstream-ignored files'
            git push origin HEAD:main
          fi
      - name: Source artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-vendored-source
          path: |
            third_party/xgboost
            third_party/xgboost.lock.json
            third_party/xgboost.manifest.json
          include-hidden-files: true
          retention-days: 7
